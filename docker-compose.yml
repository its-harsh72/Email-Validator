services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - API_PORT=${API_PORT:-4000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - redis
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-10}
      - SMTP_TIMEOUT_MS=${SMTP_TIMEOUT_MS:-10000}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-true}
      - SMTP_CATCH_ALL_PROBE=${SMTP_CATCH_ALL_PROBE:-true}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-validator@localhost}
    depends_on:
      - redis
